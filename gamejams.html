<!DOCTYPE html>
<html class="dark" lang="tr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Game Jam'ler - Gazi DOTT</title>
    <meta name="description" content="Gazi DOTT game jam'leri - 48 saat, sonsuz yaratıcılık!" />
    <link rel="canonical" href="https://gazidott.org/gamejams.html" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <script src="js/tailwind-config.js"></script>
</head>

<body class="flex min-h-screen flex-col overflow-x-hidden bg-background-dark text-white antialiased">
    <div id="navbar-placeholder"></div>

    <main class="site-main flex-grow">
        <section class="hero-stage min-h-[650px]" style="--hero-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=2070&q=85');">
            <div class="section-shell py-14 sm:py-20">
                <span class="section-kicker" data-i18n="label.buildProtocol">48 Saatlik Üretim</span>
                <h1 class="mt-4 max-w-4xl font-display text-5xl font-bold leading-[0.92] text-white sm:text-7xl" data-i18n="gamejams.title">Game Jam'ler</h1>
                <p class="mt-5 max-w-2xl text-base leading-7 text-text-muted sm:text-lg" data-i18n="gamejams.subtitle">48 saat, sonsuz yaratıcılık. Oyun geliştirme maratonlarımıza katıl!</p>

                <div class="mt-10 grid gap-7 lg:grid-cols-[minmax(220px,0.7fr)_minmax(460px,1.3fr)] lg:items-end">
                    <div>
                        <p class="text-xs font-bold uppercase text-primary" data-i18n="gamejams.nextJam">Sonraki Game Jam</p>
                        <p id="countdown-title" class="mt-2 text-xl font-bold text-white"></p>
                        <p id="countdown-desc" class="mt-2 text-sm leading-6 text-text-muted"></p>
                    </div>
                    <div id="countdown-timer" class="grid grid-cols-4 gap-2 sm:gap-3" aria-label="Game jam geri sayımı">
                        <div class="hud-panel countdown-glow flex aspect-square min-w-0 flex-col items-center justify-center p-2">
                            <span id="countdown-days" class="text-2xl font-bold text-white sm:text-4xl">--</span>
                            <span class="mt-1 text-[9px] font-bold uppercase text-text-muted sm:text-xs" data-i18n="gamejams.days">Gün</span>
                        </div>
                        <div class="hud-panel countdown-glow flex aspect-square min-w-0 flex-col items-center justify-center p-2">
                            <span id="countdown-hours" class="text-2xl font-bold text-white sm:text-4xl">--</span>
                            <span class="mt-1 text-[9px] font-bold uppercase text-text-muted sm:text-xs" data-i18n="gamejams.hours">Saat</span>
                        </div>
                        <div class="hud-panel countdown-glow flex aspect-square min-w-0 flex-col items-center justify-center p-2">
                            <span id="countdown-minutes" class="text-2xl font-bold text-white sm:text-4xl">--</span>
                            <span class="mt-1 text-[9px] font-bold uppercase text-text-muted sm:text-xs" data-i18n="gamejams.minutes">Dakika</span>
                        </div>
                        <div class="hud-panel countdown-glow flex aspect-square min-w-0 flex-col items-center justify-center p-2">
                            <span id="countdown-seconds" class="text-2xl font-bold text-primary sm:text-4xl">--</span>
                            <span class="mt-1 text-[9px] font-bold uppercase text-primary sm:text-xs" data-i18n="gamejams.seconds">Saniye</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="py-14 sm:py-16">
            <div class="section-shell">
                <div class="mb-7 flex items-center gap-3">
                    <span class="signal-dot" aria-hidden="true"></span>
                    <h2 class="text-sm font-bold uppercase text-text-muted" data-i18n="gamejams.nextJam">Sonraki Game Jam</h2>
                </div>
                <div id="gamejams-grid" class="grid grid-cols-1 gap-5 md:grid-cols-2"></div>

                <div class="mt-16 border-t border-border-dark pt-10 sm:mt-20">
                    <div class="mb-7 flex items-center gap-3">
                        <span class="h-px w-8 bg-primary" aria-hidden="true"></span>
                        <h2 class="text-xl font-bold text-white" data-i18n="gamejams.pastJams">Geçmiş Game Jam'ler</h2>
                    </div>
                    <div id="past-jams-list" class="grid grid-cols-1 gap-5 md:grid-cols-2"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>
    <script src="js/events.js"></script>
    <script src="js/countdown.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await renderGameJams();
            await initCountdownFromEvents();
        });
    </script>
</body>

</html>
